spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:printservice}
spring.datasource.username=${DB_USER:printservice}
spring.datasource.password=${DB_PASSWORD:printservice}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Background worker
worker.poll-delay-ms=${WORKER_POLL_DELAY_MS:5000}
render.delay-ms=${RENDER_DELAY_MS:10000}
render.transient-failure-probability=${RENDER_TRANSIENT_FAILURE_PROBABILITY:0}

# Distributed worker coordination. PostgreSQL advisory locks ensure only one app instance
# can render a job at a time while still allowing POST /jobs requests to remain asynchronous.
worker.lock.strategy=${WORKER_LOCK_STRATEGY:postgres-advisory}
