services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: printservice
      POSTGRES_USER: printservice
      POSTGRES_PASSWORD: printservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printservice -d printservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: printservice
      DB_USER: printservice
      DB_PASSWORD: printservice
      WORKER_POLL_DELAY_MS: 3000
      RENDER_DELAY_MS: 2000
      RENDER_TRANSIENT_FAILURE_PROBABILITY: 1
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: